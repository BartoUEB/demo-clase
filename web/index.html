<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda de barrio · demo</title>
<style>
  :root{--bg:#faf8f3;--ink:#1f2a24;--muted:#6b756f;--line:#e3ded2;--accent:#2f6b4f;--card:#fff;--err:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  .item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
  .item img{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--line)}
  .info{flex:1;min-width:0}
  .info b{display:block;font-size:15px}
  .info span{font-size:13px;color:var(--muted)}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 12px;font-size:14px;cursor:pointer}
  button:disabled{background:#b9c4bd;cursor:not-allowed}
  h2{font-size:16px;margin:24px 0 8px}
  .venta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line)}
  .venta b{color:var(--ink)}
  #estado{font-size:14px;color:var(--muted);padding:12px 0}
  #estado.error{color:var(--err)}
  #msg{position:fixed;left:16px;right:16px;bottom:16px;max-width:448px;margin:0 auto;padding:12px 14px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;display:none}
  #msg.error{background:var(--err)}
</style>
</head>
<body>
<main>
  <h1>Tienda de barrio</h1>
  <p class="sub">Inventario del día</p>
  <div id="estado">Cargando productos…</div>
  <div id="lista"></div>
  <h2>Últimas ventas</h2>
  <div id="ventas"></div>
</main>
<div id="msg" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
  const IMG_BASE = "../data/mock/imagenes/";
  let productos = [];

  // LECTURA: devuelve los productos desde Supabase
  async function cargarProductos(){
    const { data, error } = await getSupabase()
      .from("productos")
      .select("id, nombre, precio, stock, imagen")
      .order("id");
    if(error) throw error;
    productos = data;
    return productos;
  }

  // LECTURA: últimas ventas con el nombre del producto
  async function cargarVentas(){
    const { data, error } = await getSupabase()
      .from("ventas")
      .select("id, cantidad, total, fecha, productos(nombre)")
      .order("id", { ascending: false })
      .limit(5);
    if(error) throw error;
    return data;
  }

  // ESCRITURA: registra una venta de 1 unidad en ventas y descuenta stock en productos
  async function registrarVenta(producto){
    const db = getSupabase();
    const { error: errVenta } = await db.from("ventas").insert({
      producto_id: producto.id,
      cantidad: 1,
      total: producto.precio,
      fecha: new Date().toLocaleDateString("en-CA") // YYYY-MM-DD en hora local
    });
    if(errVenta) throw errVenta;

    // select() devuelve la fila: si RLS bloquea el UPDATE no hay error, pero llega vacío
    const { data, error: errStock } = await db.from("productos")
      .update({ stock: producto.stock - 1 })
      .eq("id", producto.id)
      .select();
    if(errStock) throw errStock;
    if(!data.length) throw new Error("No se pudo descontar el stock.");
  }

  const $lista = document.getElementById("lista");
  const $estado = document.getElementById("estado");
  const $ventas = document.getElementById("ventas");
  const $msg = document.getElementById("msg");
  const cop = n => "$" + Number(n).toLocaleString("es-CO");

  function aviso(texto, error){
    $msg.textContent = texto;
    $msg.className = error ? "error" : "";
    $msg.style.display = "block";
    setTimeout(()=>{$msg.style.display="none"}, 2500);
  }

  function pintar(lista){
    if(!lista.length){ $estado.textContent = "Todavía no hay productos."; $lista.innerHTML=""; return; }
    $estado.style.display = "none";
    $lista.innerHTML = lista.map(p => `
      <div class="item">
        <img src="${p.imagen.startsWith('http') ? p.imagen : IMG_BASE + p.imagen}" alt="${p.nombre}">
        <div class="info"><b>${p.nombre}</b><span>${cop(p.precio)} · Stock: ${p.stock}</span></div>
        <button data-id="${p.id}" ${p.stock<=0?"disabled":""}>Vender 1</button>
      </div>`).join("");
  }

  async function pintarVentas(){
    try{
      const ventas = await cargarVentas();
      $ventas.innerHTML = ventas.length
        ? ventas.map(v => `<div class="venta"><span>${v.fecha} · ${v.cantidad} × ${v.productos ? v.productos.nombre : "Producto"}</span><b>${cop(v.total)}</b></div>`).join("")
        : "<div class='venta'>Todavía no hay ventas.</div>";
    }catch(e){
      $ventas.innerHTML = "<div class='venta' style='color:var(--err)'>No se pudieron cargar las ventas.</div>";
      console.error(e);
    }
  }

  async function iniciar(){
    $estado.className = "";
    $estado.style.display = "block";
    $estado.textContent = "Cargando productos…";
    $lista.innerHTML = "";
    try{
      pintar(await cargarProductos());
      pintarVentas();
    }catch(e){
      $estado.className = "error";
      $estado.textContent = "No se pudo cargar el inventario. Intenta de nuevo.";
      console.error(e);
    }
  }

  $lista.addEventListener("click", async ev => {
    const btn = ev.target.closest("button[data-id]");
    if(!btn) return;
    const p = productos.find(x => x.id == btn.dataset.id);
    btn.disabled = true;
    try{
      await registrarVenta(p);
      aviso("Venta registrada: " + p.nombre);
      pintar(await cargarProductos());
      pintarVentas();
    }catch(e){
      aviso("No se pudo registrar la venta.", true);
      console.error(e);
      btn.disabled = false;
    }
  });

  iniciar();
</script>
</body>
</html>
